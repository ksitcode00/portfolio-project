<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-labelledby="title desc">
  <title id="title">Cost per closed lead comparison</title>
  <desc id="desc">Current cost per closed lead is 375 dollars. Proposed scenario is 344 dollars.</desc>
  <rect width="900" height="250" fill="#f6f8fa"/>
  <text x="48" y="48" fill="#24292f" font-family="Arial, sans-serif" font-size="25" font-weight="700">Cost per Closed Lead</text>
  <text x="48" y="76" fill="#57606a" font-family="Arial, sans-serif" font-size="16">Higher lead quality offsets a higher cost per lead</text>
  <text x="48" y="128" fill="#57606a" font-family="Arial, sans-serif" font-size="17">Current</text>
  <rect x="170" y="105" width="570" height="36" rx="4" fill="#9aa4af"/>
  <text x="760" y="130" fill="#24292f" font-family="Arial, sans-serif" font-size="20" font-weight="700">$375</text>
  <text x="48" y="195" fill="#57606a" font-family="Arial, sans-serif" font-size="17">Proposed</text>
  <rect x="170" y="172" width="523" height="36" rx="4" fill="#0a7f65"/>
  <text x="713" y="197" fill="#24292f" font-family="Arial, sans-serif" font-size="20" font-weight="700">$344</text>
  <text x="790" y="195" fill="#0a7f65" font-family="Arial, sans-serif" font-size="17" font-weight="700">−8%</text>
</svg>
