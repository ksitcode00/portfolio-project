<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-labelledby="title desc">
  <title id="title">Higher odds of respiratory symptoms during heatwave periods</title>
  <desc id="desc">Patients with asthma had approximately 2.3 times higher odds of respiratory symptoms during heatwave periods.</desc>
  <rect width="900" height="250" fill="#f6f8fa"/>
  <text x="48" y="48" fill="#24292f" font-family="Arial, sans-serif" font-size="25" font-weight="700">Respiratory-Symptom Odds During Heatwave Periods</text>
  <text x="48" y="76" fill="#57606a" font-family="Arial, sans-serif" font-size="16">Adjusted longitudinal analysis of patients with and without asthma</text>
  <line x1="165" y1="195" x2="720" y2="195" stroke="#8c959f" stroke-width="2"/>
  <rect x="265" y="142" width="125" height="53" rx="4" fill="#9aa4af"/>
  <rect x="495" y="73" width="125" height="122" rx="4" fill="#0a7f65"/>
  <text x="247" y="222" fill="#57606a" font-family="Arial, sans-serif" font-size="16">No asthma</text>
  <text x="517" y="222" fill="#57606a" font-family="Arial, sans-serif" font-size="16">Asthma</text>
  <text x="575" y="143" fill="#ffffff" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="end">2.3</text>
  <text x="579" y="132" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="700">×</text>
</svg>
